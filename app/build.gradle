plugins {
    id 'com.android.application'
}

android {
    namespace 'com.totootao.webdavuploader'
    compileSdk 34

    defaultConfig {
        applicationId 'com.totootao.webdavuploader'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 使用 debug 签名配置，方便直接安装测试；正式发布可自行配置 release 签名
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
}
