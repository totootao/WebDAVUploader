name: Publish APK Release

# 使用仓库内已编译并签名的 APK 直接创建 Release（不重新编译），
# 因此不依赖编译环境，也不会被 uploads.github.com 的代理限制影响。
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.1.0' }}
          name: WebDAV 同步 v1.1.0
          body: |
            把手机目录单向上传（同步）到 WebDAV 服务器的 Android 工具。

            ## v1.1.0 更新
            - **全新界面**：分为「任务」与「配置」两个标签页
            - **登录移入配置页**：服务器地址、用户名、密码、SSL 选项集中管理，支持「测试连接」
            - **目录同步（单向上传）**：选择本地目录，整目录（含子目录）上传，不下载、不删除远端
            - **多任务**：可添加任意多个同步任务，每个任务独立开关、独立进度、可单独同步
            - **仅 WiFi 同步**：默认开启；非 WiFi 时任务自动挂起等待，连上 WiFi 后自动续传
            - **增量跳过**：远端已存在且大小一致的文件自动跳过，不重复上传
            - 新增应用图标

            ## 功能
            - 通过系统目录选择器（SAF）授权，无需任何存储权限
            - 自动创建远程目录（MKCOL），文件以 PUT 上传，支持 Basic 认证
            - 任务卡片可查看：本地目录、远程目录、同步进度、上次同步时间与结果
            - 可选「忽略 SSL 证书」以连接自签名/测试服务器
            - 纯标准库实现（HttpURLConnection），不依赖任何第三方库

            ## 安装
            下载下方 `WebDAVUploader-v1.1.0.apk`，允许「未知来源」后安装即可。
            要求 Android 7.0（API 24）及以上。

            ## 技术信息
            - 包名：`com.totootao.webdavuploader`
            - 版本：1.1.0（versionCode 2）
            - minSdk 24 / targetSdk 34，compileSdk 34
            - 已使用 APK Signature Scheme v2 签名
          files: WebDAVUploader-v1.1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
