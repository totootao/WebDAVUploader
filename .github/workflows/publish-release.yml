name: Publish APK Release

# 使用仓库内已编译并签名的 APK 直接创建 Release（不重新编译），
# 因此不依赖编译环境，也不会被 uploads.github.com 的代理限制影响。
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.0' }}
          name: WebDAV 同步 ${{ github.ref_type == 'tag' && github.ref_name || 'v1.2.0' }}
          body: |
            把手机目录单向上传（同步）到 WebDAV 服务器的 Android 工具。

            ## v1.2.6 新增：同步状态只显示需要同步的文件数
            - 任务卡片同步中只显示 **待同步 N 个文件**，不再显示本地总数、
              服务器已有文件数（服务器上已有的文件无需同步，不必展示）
            - 顶部与卡片进度条改为 **已同步 / 待同步**，服务器上已有的文件不占进度
            - 完成结果简化为「已同步 N 个文件」（有失败时追加失败数），去掉「跳过」计数

            ## v1.2.5 修复：重复上传（重要）
            - **修复远程目录创建失败**（重复上传主因）：`ensureParentDirs` 因 Java
              `String.split` 会丢弃末尾空串，导致单层远程目录一次 MKCOL 都不发、
              多层目录漏建最深一层，结果是 PUT 全部 `409`、远端永远为空，
              每轮同步都判定「全部待上传」而反复重传
            - **远端列表获取失败不再全量重传**：PROPFIND 失败（网络异常 / 5xx / 403）
              时中止本轮并提示，不再把「获取失败」误当成「远端为空」
            - **大小未知不再每轮重传**：本地 SAF 未给出大小、或服务器未返回
              Content-Length 时，只要远端已存在同名文件就跳过
            - **修复空文件损坏**：本地大小未知时改用 chunked 上传，不再以
              `Content-Length: 0` 把远端已有文件截断成空文件
            - 目录不再计入远端文件数；URL 解码改为纯 percent 解码，修复文件名含 `+` 时匹配不上
            - 同一轮内每个远程目录只 MKCOL 一次，减少请求数
            - 已用本地 WebDAV 服务器做 7 轮端到端验证：全新上传 5/5、重复同步 0 个、
              改动单个文件精确只传 1 个

            ## v1.2.4 新增
            - 单文件上传失败**跳过不中断**：该文件计数 +1 并打日志后继续传下一个，
              整个任务跑完仍标记「完成」而非报错
            - 失败文件因远端无完整副本，下一轮循环同步（或手动再同步）会自动重新比对并重传
            - 结算通知与任务卡片展示三项：**上传 X · 跳过 Y · 失败 Z**
            - 仅「单文件上传失败」走跳过；目录无效、授权失效、读目录失败等结构性错误仍整任务报错

            ## v1.2.3 新增
            - 同步开始 / 恢复同步、递交完目录后，立即展示三项比对统计：
              **当前目录文件数**、**WebDAV 文件数**、**待上传文件数**
            - 统计同时出现在同步通知（比对完成时）与任务卡片（同步中），
              与上传判定严格一致（远端不存在 / 大小变化 / 大小未知均计入待上传）

            ## v1.2.2 新增（后台保活增强，适配红米/小米等激进省电机型）
            - 后台同步改为**前台服务**承载，避免 MIUI「神隐模式」在上传中途回收进程，
              同步期间挂一条可折叠的低优先级通知，结束自动消失
            - 调度**双保险**：JobScheduler（WiFi 约束，连 WiFi 自动续传）+ AlarmManager 精确闹钟
              （`setExactAndAllowWhileIdle` 绕过 Doze/神隐延迟），保证到点准时
            - 新增 **BootReceiver**：开机 / 应用升级后自动重排循环同步（修复此前重启即失效的洞）
            - 首次启动弹出**后台保活引导**：一键跳转小米自启动页 / 应用详情（电池无限制）页，
              并检测精确闹钟权限
            - 同步引擎从 JobService 剥离：Job 仅作触发器，真正上传在前台服务工作线程里跑

            ## v1.2.1 新增
            - 同步前先比对远程文件列表（目录级 PROPFIND），只上传本地新增 / 变更的文件，
              显著减少请求数与流量

            ## v1.2.0 新增
            - **启动自动同步**：打开软件即同步全部「未暂停 + 已过冷却」的任务
            - **同一时间只同步一个任务**，其余排队依次执行
            - **循环同步**：任务完成后进入冷却（默认 1 天），冷却结束自动再同步一次；
              冷却时长可选 6 / 12 / 24 / 48 小时，也可随时手动触发
            - **单任务暂停**：暂停后启动同步、循环同步、全部同步都会跳过它，
              仍可单独手动同步一次，点「继续」恢复
            - 同步引擎从界面剥离，后台循环由系统 JobScheduler 调度（无需常驻服务，
              重启后保留排程）；新增同步通知与下次同步时间显示

            ## 功能
            - 「任务 / 配置」双标签页；登录信息集中在配置页，支持测试连接
            - 目录同步（单向上传）：递归上传整个目录含子目录，不下载、不删除远端
            - 多任务：独立开关、独立进度、单独同步 / 全部同步
            - 仅 WiFi 同步：非 WiFi 自动挂起，连上 WiFi 自动续传
            - 增量跳过：远端已存在且大小一致的文件自动跳过
            - 通过系统目录选择器授权，无需存储权限

            ## 历史修复
            - 修复 Android 9+ 上「Expected one of [OPTIONS, GET, ...] but was MKCOL」
              导致目录创建失败、任务同步报错的问题：
              MKCOL / PROPFIND 改为原生 Socket 通道实现，
              不再受 HttpURLConnection 的方法白名单限制。

            ## 安装
            下载下方 APK，允许「未知来源」后安装即可。
            要求 Android 7.0（API 24）及以上。

            ## 技术信息
            - 包名：`com.totootao.webdavuploader`
            - minSdk 24 / targetSdk 34，compileSdk 34
            - 已使用 APK Signature Scheme v2 签名
          files: WebDAVUploader-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
