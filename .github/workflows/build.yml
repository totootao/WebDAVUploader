name: Build WebDAV Uploader APK

# 仅手动触发：编译 APK 并作为 workflow 产物上传（不创建 Release）。
# Release 由 publish-release.yml 负责，它使用仓库内已编译好的 APK。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=512m"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          for i in 1 2 3; do
            ./gradlew assembleRelease --stacktrace 2>&1 | tee ci-build.log && break
            echo "attempt $i failed, retrying..."
            sleep 15
          done
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
